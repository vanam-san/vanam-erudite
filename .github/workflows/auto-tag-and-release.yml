name: Auto Tag & Release (from package.json)

on:
  push:
    branches:
      - master
      - ci/auto-release-test
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read package.json version
        id: read_version
        run: |
          if [ ! -f package.json ]; then
            echo "no_package=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # Full semver tag so every version bump ships a release.
          # e.g., 2.1.0 -> v2.1.0
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Skip if no package.json
        if: steps.read_version.outputs.no_package == 'true'
        run: |
          echo "package.json not found; skipping release job"
      
      - name: Check if tag already exists on origin
        id: tag_exists
        if: steps.read_version.outputs.tag != ''
        run: |
          TAG=${{ steps.read_version.outputs.tag }}
          echo "Checking for tag $TAG on origin..."
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create annotated tag and push (if missing)
        if: steps.tag_exists.outputs.exists == 'false' && steps.read_version.outputs.tag != ''
        env:
          TAG: ${{ steps.read_version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      # A re-push without a version bump is a no-op: never rewrite an
      # existing release body.
      - name: Create GitHub Release with generated notes (new tags only)
        if: steps.tag_exists.outputs.exists == 'false' && steps.read_version.outputs.tag != ''
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.read_version.outputs.tag }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const res = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              draft: false,
              prerelease: false,
              generate_release_notes: true
            });
            console.log(`Created release for ${tag}: ${res.data.html_url}`);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
